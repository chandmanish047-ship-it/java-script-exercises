<!DOCTYPE HTML>
<html lang="eng">
    <head>
        <title>Reverse Numbers</title>
    </head>
    <body>
        <h1>Reverse Order Of Five Numbers</h1>
        <script>
            let numbers=[];
            for(let i=0;i<5;i++){
                let num=Number(prompt("enter the number"+(i+1)))
                numbers.push(num);
            }
            console.log("numbers in reverse order:");
            for(i=numbers.length-1;i>=0;i--){
                console.log(numbers[i]);
            }
        </script>
    </body>
</html>
